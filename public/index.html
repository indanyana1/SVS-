<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2347B5" />
    <meta name="color-scheme" content="light dark" />
    <!-- Splash screen: fill the initial paint blue so the icon blends, then
         the React app's own CSS vars take over once loaded. -->
    <style>
      html, body, #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: #2347B5;
      }
    </style>

    <link rel="icon" type="image/png" href="%PUBLIC_URL%/images/biznisdil-icon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/biznisdil-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/images/biznisdil-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/images/biznisdil-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Capture beforeinstallprompt synchronously before any JS bundle loads.
         The React app reads window.__pwaInstallEvent on mount. -->
    <script>
      window.__pwaInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallEvent = e;
      });
    </script>

    <!-- Primary SEO -->
    <title>Biznisdil — All-in-one marketplace for products, services, tickets, property &amp; more</title>
    <meta
      name="description"
      content="Buy, sell, book and negotiate across 24+ marketplaces — electronics, groceries, fast food, fashion, property, livestock, tickets, beverages, home-care and more. Real-time chat, AI listings, secure payments."
    />
    <meta name="keywords" content="Biznisdil, ecommerce, marketplace, online shopping, tickets, property, groceries, fast food, livestock, electronics, fashion, South Africa" />
    <meta name="author" content="Biznisdil" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://biznisdil.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Biznisdil" />
    <meta property="og:title" content="Biznisdil — All-in-one marketplace" />
    <meta property="og:description" content="Buy, sell, book and negotiate across 24+ marketplaces with real-time chat, AI listings and secure payments." />
    <meta property="og:url" content="https://biznisdil.com/" />
    <meta property="og:image" content="https://biznisdil.com/favicon.ico" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Biznisdil — All-in-one marketplace" />
    <meta name="twitter:description" content="Buy, sell, book and negotiate across 24+ marketplaces with real-time chat, AI listings and secure payments." />
    <meta name="twitter:image" content="https://biznisdil.com/favicon.ico" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Biznisdil",
        "url": "https://biznisdil.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://biznisdil.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Biznisdil",
        "url": "https://biznisdil.com/",
        "logo": "https://biznisdil.com/favicon.ico"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
