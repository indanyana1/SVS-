<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6674" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Primary SEO -->
    <title>SVS E-Commerce — All-in-one marketplace for products, services, tickets, property &amp; more</title>
    <meta
      name="description"
      content="Buy, sell, book and negotiate across 11 marketplaces — electronics, groceries, fast food, fashion, property, livestock, tickets, beverages, home-care and more. Real-time chat, AI listings, secure payments."
    />
    <meta name="keywords" content="SVS, ecommerce, marketplace, online shopping, tickets, property, groceries, fast food, livestock, electronics, fashion, South Africa" />
    <meta name="author" content="SVS E-Commerce" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://svs-ecommerce.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVS E-Commerce" />
    <meta property="og:title" content="SVS E-Commerce — All-in-one marketplace" />
    <meta property="og:description" content="Buy, sell, book and negotiate across 11 marketplaces with real-time chat, AI listings and secure payments." />
    <meta property="og:url" content="https://svs-ecommerce.com/" />
    <meta property="og:image" content="https://svs-ecommerce.com/favicon.ico" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SVS E-Commerce — All-in-one marketplace" />
    <meta name="twitter:description" content="Buy, sell, book and negotiate across 11 marketplaces with real-time chat, AI listings and secure payments." />
    <meta name="twitter:image" content="https://svs-ecommerce.com/favicon.ico" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SVS E-Commerce",
        "url": "https://svs-ecommerce.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://svs-ecommerce.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SVS E-Commerce",
        "url": "https://svs-ecommerce.com/",
        "logo": "https://svs-ecommerce.com/favicon.ico"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
